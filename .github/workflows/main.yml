name: 24/7 Bot Runner

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # يعمل كل 6 ساعات

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install telethon
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start Bot
        run: |
          echo "Checking files in repository..."
          ls -la
          
          # إعطاء صلاحيات للملف إذا كان موجوداً، وتخطي الخطأ إذا لم يوجد
          [ -f bot_session.session ] && chmod 666 bot_session.session || echo "Warning: bot_session.session not found"
          
          echo "Starting Python script..."
          python main.py
