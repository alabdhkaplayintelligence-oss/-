name: 24/7 Bot Runner

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Fix File Names and Permissions
        run: |
          echo "Checking and fixing file names..."
          # تحويل الأسماء إذا كانت تنتهي بـ .txt أو أسماء غير صحيحة
          [ -f main.py.txt ] && mv main.py.txt main.py || echo "main.py is ready"
          [ -f requirements.txt.txt ] && mv requirements.txt.txt requirements.txt || echo "requirements.txt is ready"
          [ -f bot_session.session-journal ] && mv bot_session.session-journal bot_session.session || echo "session file checked"
          
          # إعطاء الصلاحيات
          chmod 666 bot_session.session || true
          ls -la

      - name: Install Dependencies
        run: |
          pip install telethon
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start Bot
        run: |
          echo "Starting the bot..."
          python main.py
